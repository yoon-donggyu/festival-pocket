<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>부산불꽃축제 공유 3D 지도</title>
<script src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js"></script>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css">
<style>
*{box-sizing:border-box}html,body,#map{width:100%;height:100%;margin:0}body{font-family:-apple-system,BlinkMacSystemFont,'Pretendard','Noto Sans KR',sans-serif;background:#0b0d12;color:#fff;overflow:hidden}#map{position:fixed;inset:0}.top,.panel{position:fixed;z-index:10;left:10px;right:10px;background:rgba(15,18,24,.91);border:1px solid rgba(255,255,255,.14);border-radius:17px;backdrop-filter:blur(12px)}.top{top:max(10px,env(safe-area-inset-top));min-height:58px;display:flex;align-items:center;gap:10px;padding:9px 12px}.top a{color:#fff;text-decoration:none;font-size:22px}.top b{display:block;font-size:14px}.top span{display:block;color:#a9b1bf;font-size:11px;margin-top:2px}.top .hint{margin-left:auto;flex:0 0 auto;border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 8px;color:#dce2eb;font-size:10px;font-weight:800}.panel{bottom:max(10px,env(safe-area-inset-bottom));padding:0;overflow:hidden}.panel-toggle{width:100%;height:39px;border:0;background:rgba(255,255,255,.035);color:#dce2eb;font-size:12px;font-weight:850;display:flex;align-items:center;justify-content:center;gap:6px}.panel-body{padding:12px;padding-top:7px;max-height:min(58vh,520px);overflow:auto}.panel.collapsed .panel-body{display:none}.analysis-head{display:grid;grid-template-columns:92px 1fr;gap:8px;margin-bottom:8px}.score{display:flex;flex-direction:column;justify-content:center;background:rgba(255,255,255,.06);border-radius:14px;padding:10px 12px}.score small{color:#a9b1bf;font-size:10px}.score strong{margin-top:1px;font-size:29px;line-height:1}.score strong span{font-size:12px;margin-left:2px}.result{background:rgba(255,255,255,.05);border-radius:14px;padding:10px 12px;min-width:0}.result small{display:block;color:#a9b1bf;font-size:10px}.result b{display:block;margin-top:4px;font-size:14px}.result p{margin:4px 0 0;color:#9da6b5;font-size:10px;line-height:1.35}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:rgba(255,255,255,.05);border-radius:12px;padding:9px 10px}.stat small{display:block;color:#a9b1bf;font-size:10px}.stat b{display:block;margin-top:4px;font-size:13px}.bands{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.band{border-radius:11px;padding:8px 7px;background:rgba(255,255,255,.05);text-align:center}.band small{display:block;font-size:9px;color:#9da6b5}.band b{display:block;margin-top:3px;font-size:11px}.band.ok{background:rgba(66,190,120,.13);border:1px solid rgba(66,190,120,.24)}.band.bad{background:rgba(255,100,112,.12);border:1px solid rgba(255,100,112,.22)}.band.wait{opacity:.62}.bar{display:flex;gap:7px;overflow:auto;margin-top:8px;scrollbar-width:none}.bar::-webkit-scrollbar{display:none}.bar button{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff;border-radius:11px;padding:9px 11px;white-space:nowrap;font-size:11px;font-weight:800}.bar button.on{background:rgba(138,180,255,.2);border-color:#8ab4ff}.note{color:#929baa;font-size:10px;line-height:1.45;margin-top:9px}.pin{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#111;border:2px solid #fff;font-size:17px;box-shadow:0 8px 22px rgba(0,0,0,.35)}.fire{position:relative;width:46px;height:46px;background:#431b4f;font-size:23px;box-shadow:0 0 0 8px rgba(255,116,145,.10),0 8px 22px rgba(0,0,0,.35)}.fire:after{content:"";position:absolute;width:58px;height:58px;border:1px solid rgba(255,139,164,.35);border-radius:50%;animation:pulse 1.8s infinite}@keyframes pulse{0%{transform:scale(.7);opacity:.8}100%{transform:scale(1.35);opacity:0}}.maplibregl-ctrl-top-left{top:78px}.toast{position:fixed;z-index:30;left:50%;top:88px;transform:translateX(-50%) translateY(-8px);opacity:0;pointer-events:none;background:rgba(10,12,16,.92);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:8px 12px;font-size:10px;font-weight:800;white-space:nowrap;transition:.18s}.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}@media(min-width:800px){.top{right:auto;width:550px}.panel{left:auto;width:410px}.panel-body{max-height:650px}}@media(prefers-reduced-motion:reduce){.fire:after{animation:none}}
</style>
</head>
<body>
<div id="map"></div>
<header class="top"><a href="./" aria-label="돌아가기">←</a><div><b>부산불꽃축제 · 3D 시야 분석</b><span>지도를 눌러 원하는 관람 위치를 분석하세요</span></div><div class="hint">탭해서 분석</div></header>
<div class="toast" id="toast"></div>
<section class="panel collapsed" id="infoPanel">
<button class="panel-toggle" id="panelToggle" type="button" aria-expanded="false">▲ 시야 분석 열기</button>
<div class="panel-body">
<div class="analysis-head"><div class="score"><small>간이 시야 점수</small><strong id="score">-<span>점</span></strong></div><div class="result"><small>가림 판정</small><b id="blockResult">분석 전</b><p id="blockDetail">지도에서 관람 위치를 누르면 분석합니다.</p></div></div>
<div class="stats"><div class="stat"><small>불꽃 중심까지</small><b id="distance">-</b></div><div class="stat"><small>관람 높이</small><b id="spotName">-</b></div></div>
<div class="bands"><div class="band wait" id="band50"><small>저고도 50m</small><b>-</b></div><div class="band wait" id="band150"><small>중고도 150m</small><b>-</b></div><div class="band wait" id="band300"><small>고고도 300m</small><b>-</b></div></div>
<div class="bar"><button class="on" data-view="observer">관람뷰</button><button data-view="overview">전체뷰</button><button data-view="target">불꽃 위치</button></div>
<div class="bar"><button class="on" data-height="ground">지상 눈높이</button><button data-height="roof">+30m 옥상 가정</button><button id="pknu">부경대 위치</button></div>
<div class="note">※ 공개 지형·OpenStreetMap 건물 데이터 기반 간이 분석입니다. 불꽃 높이는 50m·150m·300m로 가정하며 실제 발사 위치·건물 높이·현장 구조에 따라 차이가 날 수 있습니다.</div>
</div>
</section>
<script>
(()=>{
'use strict';
const PKNU={lat:35.134,lng:129.105,name:'부경대 대연캠퍼스'};
const TARGET={lat:35.1463306,lng:129.1286389};
const HEIGHTS=[50,150,300];
let current={...PKNU},observerOffset=31.7,obs,fire,analysisSeq=0,lastResult=null;
const rad=x=>x*Math.PI/180;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),1800)}
function distance(a,b,c,d){const R=6371008.8,p1=rad(a),p2=rad(c),dp=rad(c-a),dl=rad(d-b),v=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.atan2(Math.sqrt(v),Math.sqrt(1-v))}
function bearing(a,b,c,d){const dl=rad(d-b),y=Math.sin(dl)*Math.cos(rad(c)),x=Math.cos(rad(a))*Math.sin(rad(c))-Math.sin(rad(a))*Math.cos(rad(c))*Math.cos(dl);return(Math.atan2(y,x)*180/Math.PI+360)%360}
function pin(text,fireClass){const e=document.createElement('div');e.className='pin'+(fireClass?' fire':'');e.textContent=text;return e}
function lineData(){return{type:'Feature',geometry:{type:'LineString',coordinates:[[current.lng,current.lat],[TARGET.lng,TARGET.lat]]}}}
function openPanel(){const p=document.getElementById('infoPanel'),t=document.getElementById('panelToggle');p.classList.remove('collapsed');t.textContent='▼ 시야 분석 접기';t.setAttribute('aria-expanded','true')}
function setBand(id,state){const el=document.getElementById('band'+id);el.className='band '+(state===null?'wait':state?'ok':'bad');el.querySelector('b').textContent=state===null?'분석 중':state?'보임':'가림 가능'}
function setLoading(){document.getElementById('score').innerHTML='…<span>점</span>';document.getElementById('blockResult').textContent='시야 계산 중';document.getElementById('blockDetail').textContent='지형과 건물 데이터를 확인하고 있습니다.';HEIGHTS.forEach(h=>setBand(h,null))}
function updateBasic(){document.getElementById('distance').textContent=(distance(current.lat,current.lng,TARGET.lat,TARGET.lng)/1000).toFixed(2)+' km';document.getElementById('spotName').textContent=observerOffset>10?'+30m 옥상 가정':'지상 눈높이';const s=map.getSource('sight');if(s)s.setData(lineData());if(obs)obs.setLngLat([current.lng,current.lat]);document.querySelectorAll('[data-height]').forEach(b=>b.classList.toggle('on',(observerOffset>10?'roof':'ground')===b.dataset.height))}
function observer(){map.flyTo({center:[current.lng,current.lat],zoom:16.5,pitch:72,bearing:bearing(current.lat,current.lng,TARGET.lat,TARGET.lng),duration:850})}
function overview(){const bounds=new maplibregl.LngLatBounds();bounds.extend([current.lng,current.lat]);bounds.extend([TARGET.lng,TARGET.lat]);map.fitBounds(bounds,{padding:{top:100,bottom:150,left:55,right:55},maxZoom:14.8,pitch:50,bearing:bearing(current.lat,current.lng,TARGET.lat,TARGET.lng),duration:750})}
function targetView(){map.flyTo({center:[TARGET.lng,TARGET.lat],zoom:15.7,pitch:66,bearing:bearing(TARGET.lat,TARGET.lng,current.lat,current.lng),duration:850})}
function xy(lng,lat,refLat){const k=111320,c=Math.cos(rad(refLat));return{x:lng*k*c,y:lat*k}}
function orient(a,b,c){return(b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x)}
function onSeg(a,b,c){return Math.min(a.x,b.x)-.01<=c.x&&c.x<=Math.max(a.x,b.x)+.01&&Math.min(a.y,b.y)-.01<=c.y&&c.y<=Math.max(a.y,b.y)+.01}
function segHit(a,b,c,d){const o1=orient(a,b,c),o2=orient(a,b,d),o3=orient(c,d,a),o4=orient(c,d,b);if(((o1>0&&o2<0)||(o1<0&&o2>0))&&((o3>0&&o4<0)||(o3<0&&o4>0)))return true;if(Math.abs(o1)<.001&&onSeg(a,b,c))return true;if(Math.abs(o2)<.001&&onSeg(a,b,d))return true;if(Math.abs(o3)<.001&&onSeg(c,d,a))return true;if(Math.abs(o4)<.001&&onSeg(c,d,b))return true;return false}
function pointInRing(p,ring){let inside=false;for(let i=0,j=ring.length-1;i<ring.length;j=i++){const a=ring[i],b=ring[j];if(((a.y>p.y)!==(b.y>p.y))&&(p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y||1e-9)+a.x))inside=!inside}return inside}
function polygonIntersectsLine(coords,a,b,refLat){if(!coords||!coords.length)return false;const ring=coords[0].map(p=>xy(p[0],p[1],refLat));if(pointInRing(a,ring)||pointInRing(b,ring))return true;for(let i=1;i<ring.length;i++)if(segHit(a,b,ring[i-1],ring[i]))return true;return false}
function geomIntersects(g,a,b,refLat){if(!g)return false;if(g.type==='Polygon')return polygonIntersectsLine(g.coordinates,a,b,refLat);if(g.type==='MultiPolygon')return g.coordinates.some(p=>polygonIntersectsLine(p,a,b,refLat));return false}
function centroid(g){let ring;if(g?.type==='Polygon')ring=g.coordinates?.[0];else if(g?.type==='MultiPolygon')ring=g.coordinates?.[0]?.[0];if(!ring?.length)return null;let x=0,y=0,n=0;ring.forEach(p=>{if(Number.isFinite(p[0])&&Number.isFinite(p[1])){x+=p[0];y+=p[1];n++}});return n?{lng:x/n,lat:y/n}:null}
function fractionAlong(lng,lat){const ref=(current.lat+TARGET.lat)/2,a=xy(current.lng,current.lat,ref),b=xy(TARGET.lng,TARGET.lat,ref),p=xy(lng,lat,ref),dx=b.x-a.x,dy=b.y-a.y,den=dx*dx+dy*dy;return den?clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/den,0,1):0}
function buildingHeight(p){let h=parseFloat(p?.render_height??p?.height);if(!Number.isFinite(h)){const lv=parseFloat(p?.render_levels??p?.levels);if(Number.isFinite(lv))h=lv*3}return Number.isFinite(h)&&h>0?h:8}
function distanceScore(km){if(km<.35)return 9;if(km<=1.5)return 15;if(km<=2.5)return 14;if(km<=4)return 11;if(km<=6)return 7;return 3}
async function analyze(seq){
 const N=56,samples=[];for(let i=0;i<N;i++){const t=i/(N-1),lng=current.lng+(TARGET.lng-current.lng)*t,lat=current.lat+(TARGET.lat-current.lat)*t;let elev=null;try{elev=map.queryTerrainElevation([lng,lat])}catch(e){}samples.push({t,lng,lat,elev:Number.isFinite(elev)?elev:null})}
 const valid=samples.filter(s=>s.elev!==null).length,startGround=samples[0].elev??0,targetGround=samples[N-1].elev??0;
 let raw=[];try{raw=map.querySourceFeatures('openmaptiles',{sourceLayer:'building'})||[]}catch(e){}
 const ref=(current.lat+TARGET.lat)/2,a=xy(current.lng,current.lat,ref),b=xy(TARGET.lng,TARGET.lat,ref),seen=new Set(),buildings=[];
 for(const f of raw){const c=centroid(f.geometry);if(!c)continue;const key=String(f.id??f.properties?.osm_id??f.properties?.id??(c.lng.toFixed(5)+','+c.lat.toFixed(5)));if(seen.has(key))continue;seen.add(key);if(!geomIntersects(f.geometry,a,b,ref))continue;const t=fractionAlong(c.lng,c.lat);if(t<.025||t>.975)continue;buildings.push({t,h:buildingHeight(f.properties),c})}
 function nearTerrain(t){const idx=Math.round(t*(N-1));return samples[clamp(idx,0,N-1)].elev??0}
 const outcomes={};
 for(const H of HEIGHTS){const eye=startGround+observerOffset,fireTop=targetGround+H;let terrainBlock=false,buildingBlock=false,blockingBuildings=0;for(const s of samples){if(s.t<.03||s.t>.97||s.elev===null)continue;const ray=eye+(fireTop-eye)*s.t;if(s.elev>ray+1.5){terrainBlock=true;break}}for(const bu of buildings){const ray=eye+(fireTop-eye)*bu.t,top=nearTerrain(bu.t)+bu.h;if(top>ray+1.5){buildingBlock=true;blockingBuildings++}}outcomes[H]={visible:!(terrainBlock||buildingBlock),terrainBlock,buildingBlock,blockingBuildings}}
 if(seq!==analysisSeq)return null;
 const km=distance(current.lat,current.lng,TARGET.lat,TARGET.lng)/1000;
 let score=distanceScore(km)+(outcomes[50].visible?25:0)+(outcomes[150].visible?35:0)+(outcomes[300].visible?25:0);score=clamp(Math.round(score),0,100);
 const vis=HEIGHTS.filter(h=>outcomes[h].visible).length;let label=vis===3?'가림 위험 낮음':vis===2?'일부 저고도 가림 가능':vis===1?'고고도 중심 관람 권장':'가림 가능성 높음';
 const mid=outcomes[150],parts=[];if(mid.buildingBlock)parts.push('건물 '+mid.blockingBuildings+'곳 영향');if(mid.terrainBlock)parts.push('지형 영향');if(!parts.length)parts.push('중고도 시야선 뚜렷');if(valid<N*.55)parts.push('지형 데이터 일부 제한');
 return{score,label,detail:parts.join(' · '),outcomes,km,buildings:buildings.length,terrainCoverage:valid/N}
}
function renderResult(r){if(!r)return;lastResult=r;document.getElementById('score').innerHTML=r.score+'<span>점</span>';document.getElementById('blockResult').textContent=r.label;document.getElementById('blockDetail').textContent=r.detail;HEIGHTS.forEach(h=>setBand(h,r.outcomes[h].visible))}
function analyzeCurrent(moveToView=true,reveal=true){analysisSeq++;const seq=analysisSeq;if(reveal)openPanel();setLoading();overview();const wait=()=>{map.once('idle',async()=>{const r=await analyze(seq);if(seq!==analysisSeq)return;renderResult(r);toast('시야 분석 완료');if(moveToView)setTimeout(observer,180)})};setTimeout(wait,120)}
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[129.1168,35.1402],zoom:14.5,pitch:60,bearing:bearing(current.lat,current.lng,TARGET.lat,TARGET.lng),antialias:true});
map.addControl(new maplibregl.NavigationControl({showCompass:true}),'top-left');
map.on('load',()=>{
 try{map.addSource('fp-terrain',{type:'raster-dem',tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],tileSize:256,maxzoom:15,encoding:'terrarium'});map.setTerrain({source:'fp-terrain',exaggeration:1})}catch(e){console.warn('terrain unavailable',e)}
 try{if(map.getSource('openmaptiles')){const first=(map.getStyle().layers||[]).find(l=>l.type==='symbol');map.addLayer({id:'fp3d',type:'fill-extrusion',source:'openmaptiles','source-layer':'building',minzoom:13,paint:{'fill-extrusion-color':'#aeb5c3','fill-extrusion-height':['coalesce',['get','render_height'],['get','height'],10],'fill-extrusion-base':['coalesce',['get','render_min_height'],0],'fill-extrusion-opacity':.78}},first&&first.id)}}catch(e){console.warn('buildings unavailable',e)}
 map.addSource('sight',{type:'geojson',data:lineData()});map.addLayer({id:'sightline',type:'line',source:'sight',paint:{'line-color':'#ff6685','line-width':4,'line-opacity':.9}});
 obs=new maplibregl.Marker({element:pin('👁')}).setLngLat([current.lng,current.lat]).addTo(map);fire=new maplibregl.Marker({element:pin('🎆',true)}).setLngLat([TARGET.lng,TARGET.lat]).addTo(map);updateBasic();observer()
});
map.on('click',e=>{current={lat:e.lngLat.lat,lng:e.lngLat.lng,name:'선택 위치'};observerOffset=1.7;lastResult=null;updateBasic();analyzeCurrent(true,true)});
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('on'));b.classList.add('on');b.dataset.view==='observer'?observer():b.dataset.view==='overview'?overview():targetView()});
document.querySelectorAll('[data-height]').forEach(b=>b.onclick=()=>{observerOffset=b.dataset.height==='roof'?31.7:1.7;lastResult=null;updateBasic();analyzeCurrent(false,true)});
document.getElementById('pknu').onclick=()=>{current={...PKNU};observerOffset=31.7;lastResult=null;updateBasic();analyzeCurrent(true,true)};
const panel=document.getElementById('infoPanel'),toggle=document.getElementById('panelToggle');toggle.onclick=()=>{const collapsed=panel.classList.toggle('collapsed');toggle.textContent=collapsed?'▲ 시야 분석 열기':'▼ 시야 분석 접기';toggle.setAttribute('aria-expanded',String(!collapsed));if(!collapsed&&!lastResult)analyzeCurrent(true,false);setTimeout(()=>map.resize(),180)};
})();
</script>
</body>
</html>
