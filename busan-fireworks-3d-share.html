<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>부산불꽃축제 공유 3D 지도</title><script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css"><style>html,body,#map{width:100%;height:100%;margin:0}body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;background:#0b0d12;color:white;overflow:hidden}#map{position:fixed;inset:0}.top,.panel{position:fixed;z-index:10;left:10px;right:10px;background:rgba(15,18,24,.9);border:1px solid rgba(255,255,255,.14);border-radius:16px;backdrop-filter:blur(12px)}.top{top:10px;min-height:50px;display:flex;align-items:center;gap:10px;padding:8px 12px}.top a{color:white;text-decoration:none;font-size:22px}.top b{display:block;font-size:14px}.top span{display:block;color:#a9b1bf;font-size:11px;margin-top:2px}.panel{bottom:10px;padding:0;overflow:hidden;transition:max-height .2s ease}.panel-toggle{width:100%;height:42px;border:0;background:rgba(255,255,255,.035);color:#dce2eb;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px}.panel-body{padding:12px;padding-top:8px}.panel.collapsed .panel-body{display:none}.panel.collapsed .panel-toggle{height:38px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:rgba(255,255,255,.05);border-radius:12px;padding:10px}.stat small{display:block;color:#a9b1bf;font-size:11px}.stat b{display:block;margin-top:4px;font-size:14px}.bar{display:flex;gap:7px;overflow:auto;margin-top:8px}.bar button{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:white;border-radius:11px;padding:9px 11px;white-space:nowrap}.bar button.on{background:rgba(138,180,255,.2);border-color:#8ab4ff}.note{color:#a9b1bf;font-size:11px;line-height:1.45;margin-top:9px}.pin{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#111;border:2px solid white;font-size:17px;box-shadow:0 8px 22px rgba(0,0,0,.35)}.fire{width:44px;height:44px;background:#431b4f;font-size:22px}@media(min-width:800px){.top{right:auto;width:520px}.panel{left:auto;width:390px}}</style></head><body><div id="map"></div><header class="top"><a href="./">←</a><div><b>부산불꽃축제 · 공유용 3D</b><span>부경대 → 광안대교 시야 방향</span></div></header><section class="panel collapsed" id="infoPanel"><button class="panel-toggle" id="panelToggle" type="button" aria-expanded="false">▲ 정보 열기</button><div class="panel-body"><div class="stats"><div class="stat"><small>광안대교까지</small><b id="distance">-</b></div><div class="stat"><small>관람 위치</small><b id="spotName">-</b></div></div><div class="bar"><button class="on" data-view="observer">관람뷰</button><button data-view="overview">전체뷰</button><button data-view="target">불꽃 위치</button></div><div class="bar"><button class="on" data-spot="roof">부경대 옥상</button><button data-spot="ground">부경대 지상</button></div><div class="note">공개 지도 데이터 기반 3D 시각화입니다. 정밀 건물/지형 가림 판정은 기존 Cesium 분석 페이지와 차이가 있을 수 있습니다.</div></div></section><script>(()=>{'use strict';const spots={roof:{id:'roof',name:'옥상 약 30m',lat:35.134,lng:129.105},ground:{id:'ground',name:'지상 눈높이',lat:35.134,lng:129.105}},target={lat:35.1463306,lng:129.1286389};let current=spots.roof,obs,fire;const rad=x=>x*Math.PI/180;function distance(a,b,c,d){const R=6371008.8,p1=rad(a),p2=rad(c),dp=rad(c-a),dl=rad(d-b),v=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.atan2(Math.sqrt(v),Math.sqrt(1-v))}function bearing(a,b,c,d){const dl=rad(d-b),y=Math.sin(dl)*Math.cos(rad(c)),x=Math.cos(rad(a))*Math.sin(rad(c))-Math.sin(rad(a))*Math.cos(rad(c))*Math.cos(dl);return(Math.atan2(y,x)*180/Math.PI+360)%360}function pin(text,fireClass){const e=document.createElement('div');e.className='pin'+(fireClass?' fire':'');e.textContent=text;return e}const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[129.1168,35.1402],zoom:14.5,pitch:62,bearing:bearing(current.lat,current.lng,target.lat,target.lng),antialias:true});map.addControl(new maplibregl.NavigationControl(),'top-left');map.on('load',()=>{try{if(map.getSource('openmaptiles')){const first=(map.getStyle().layers||[]).find(l=>l.type==='symbol');map.addLayer({id:'fp3d',type:'fill-extrusion',source:'openmaptiles','source-layer':'building',minzoom:13,paint:{'fill-extrusion-color':'#b8bcc4','fill-extrusion-height':['coalesce',['get','render_height'],['get','height'],10],'fill-extrusion-base':['coalesce',['get','render_min_height'],0],'fill-extrusion-opacity':.72}},first&&first.id)}}catch(e){console.warn(e)}map.addSource('sight',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:[[current.lng,current.lat],[target.lng,target.lat]]}}});map.addLayer({id:'sightline',type:'line',source:'sight',paint:{'line-color':'#ff6b8a','line-width':4}});obs=new maplibregl.Marker({element:pin('👁')}).setLngLat([current.lng,current.lat]).addTo(map);fire=new maplibregl.Marker({element:pin('🎆',true)}).setLngLat([target.lng,target.lat]).addTo(map);update();observer()});function update(){document.getElementById('distance').textContent=(distance(current.lat,current.lng,target.lat,target.lng)/1000).toFixed(2)+' km';document.getElementById('spotName').textContent=current.name;const s=map.getSource('sight');if(s)s.setData({type:'Feature',geometry:{type:'LineString',coordinates:[[current.lng,current.lat],[target.lng,target.lat]]}});if(obs)obs.setLngLat([current.lng,current.lat]);document.querySelectorAll('[data-spot]').forEach(b=>b.classList.toggle('on',b.dataset.spot===current.id))}function observer(){map.flyTo({center:[current.lng,current.lat],zoom:16.3,pitch:70,bearing:bearing(current.lat,current.lng,target.lat,target.lng),duration:900})}function overview(){map.flyTo({center:[129.1168,35.1402],zoom:14.3,pitch:55,bearing:bearing(current.lat,current.lng,target.lat,target.lng),duration:900})}function targetView(){map.flyTo({center:[target.lng,target.lat],zoom:15.6,pitch:65,bearing:bearing(target.lat,target.lng,current.lat,current.lng),duration:900})}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('on'));b.classList.add('on');b.dataset.view==='observer'?observer():b.dataset.view==='overview'?overview():targetView()});document.querySelectorAll('[data-spot]').forEach(b=>b.onclick=()=>{current=spots[b.dataset.spot]||current;update();observer()});const panel=document.getElementById('infoPanel'),toggle=document.getElementById('panelToggle');toggle.onclick=()=>{const collapsed=panel.classList.toggle('collapsed');toggle.textContent=collapsed?'▲ 정보 열기':'▼ 정보 접기';toggle.setAttribute('aria-expanded',String(!collapsed));setTimeout(()=>map.resize(),220)}})();</script></body></html>
