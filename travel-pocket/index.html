<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Travel Pocket · 항공권 비교</title><style>:root{--bg:#f5f5f3;--text:#111;--muted:#777;--green:#287a48;--blue:#315cc9;--amber:#94651d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;letter-spacing:-.025em}button,input,select{font:inherit}a{text-decoration:none;color:inherit}.wrap{max-width:920px;margin:auto;padding:0 14px}.hero{padding:22px 2px 12px}.hero h1{font-size:32px;line-height:1.08;margin:6px 0}.eyebrow{font-size:10px;font-weight:900;color:#1f5eff}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:14px}.summary>div,.deal{background:#fff;border-radius:18px;box-shadow:0 6px 20px rgba(0,0,0,.05)}.summary>div{padding:12px}.summary b{display:block;font-size:17px}.summary span{font-size:9px;color:var(--muted)}.sticky{position:sticky;top:0;z-index:20;background:rgba(245,245,243,.94);backdrop-filter:blur(18px);padding:8px 0}.filters{display:flex;gap:6px;overflow:auto}.filters button{border:0;background:#fff;border-radius:999px;padding:9px 12px;font-size:10px;font-weight:900;white-space:nowrap}.filters button.on{background:#111;color:#fff}.section{margin-top:18px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:8px}.head h2{margin:0;font-size:21px}.head small{font-size:9px;color:var(--muted)}.search{display:grid;grid-template-columns:1fr 125px;gap:7px}.search input,.search select{border:0;background:#fff;border-radius:13px;height:41px;padding:0 12px}.ranklist{display:grid;gap:9px;margin-top:9px}.deal{overflow:hidden}.deal summary{list-style:none;padding:14px}.row{display:flex;gap:10px;align-items:center}.rank{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#111;color:#fff;font-size:12px;font-weight:900}.title{font-size:16px;font-weight:900}.sub{font-size:10px;color:var(--muted);margin-top:3px}.price{font-size:20px;font-weight:900;margin-top:4px}.price small{font-size:9px;color:var(--muted)}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.chip{font-size:9px;font-weight:900;border-radius:999px;padding:5px 7px;background:#f2f2f7}.blue{background:#eaf0ff;color:var(--blue)}.green{background:#eaf4ed;color:var(--green)}.amber{background:#fff2dd;color:var(--amber)}.body{border-top:1px solid rgba(0,0,0,.08);padding:12px 14px 14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.grid div{background:#f7f7f5;border-radius:12px;padding:9px}.grid small{display:block;font-size:8px;color:var(--muted)}.grid b{font-size:11px}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:9px}.actions a,.actions span{text-align:center;padding:11px 4px;border-radius:11px;background:#f2f2f7;font-size:9px;font-weight:900}.actions a.main{background:#111;color:#fff}.actions a.official{background:#eaf4ed;color:var(--green)}.disabled{color:#999}.note{font-size:9px;color:var(--muted);line-height:1.5;margin-top:8px}.empty{background:#fff;border-radius:17px;padding:16px;font-size:11px;color:var(--muted)}@media(max-width:650px){.summary{grid-template-columns:repeat(2,1fr)}.grid,.actions{grid-template-columns:1fr}.search{grid-template-columns:1fr 105px}}</style></head><body><header class="wrap hero"><div class="eyebrow">TRAVEL POCKET</div><h1>국제선 TOP100 + 제주 TOP10</h1><div class="summary"><div><b id="intCount">-</b><span>국제선 TOP</span></div><div><b id="jejuCount">-</b><span>제주 TOP</span></div><div><b id="googleCount">-</b><span>국제선 Google 검증</span></div><div><b id="updatedAt">-</b><span>업데이트</span></div></div></header><div class="sticky"><div class="wrap"><div class="filters"><button class="on" onclick="setFilter('all',this)">국제선 전체</button><button onclick="setFilter('JEJU',this)">🇰🇷 제주 TOP10</button><button onclick="setFilter('JP',this)">일본</button><button onclick="setFilter('SEA',this)">동남아</button><button onclick="setFilter('CN',this)">중국·몽골</button><button onclick="setFilter('EU',this)">유럽·중동</button><button onclick="setFilter('AM',this)">미주</button><button onclick="setFilter('OC',this)">대양주</button><button onclick="setFilter('google',this)">Google 검증</button></div></div></div><main class="wrap"><section class="section"><div class="head"><h2 id="sectionTitle">국제선 TOP 100</h2><small id="status">불러오는 중</small></div><div class="search"><input id="q" placeholder="도시·공항·항공사 검색" oninput="render()"><select id="sort" onchange="render()"><option value="price">가격순</option><option value="trust">신뢰도순</option><option value="date">출발일순</option></select></div><div id="list" class="ranklist"></div></section></main><script>const REG={JP:['KIX','NRT','HND','FUK','CTS','OKA','NGO','MMY'],SEA:['TPE','HKG','SIN','BKK','CNX','DPS','DAD','CXR','MPH','CEB','HAN','SGN','PQC','BKI','HKT','KUL','MNL'],CN:['PEK','PKX','PVG','TAO','CAN','SZX','ULN','ALA','TAS'],EU:['DXB','AUH','DOH','IST','LHR','CDG','FCO','BCN','MAD','FRA','MUC','AMS','ZRH','VIE','PRG','BUD'],AM:['LAX','SFO','SEA','JFK','YVR','YYZ','HNL'],OC:['GUM','SPN','SYD','MEL','BNE','AKL']};const OFFICIAL={'KE':'https://www.koreanair.com/','OZ':'https://flyasiana.com/','7C':'https://www.jejuair.net/','LJ':'https://www.jinair.com/','TW':'https://www.twayair.com/','ZE':'https://www.eastarjet.com/','BX':'https://www.airbusan.com/','RS':'https://www.flyairseoul.com/'};let international=[],jeju=[],serpMap=new Map(),active='all';const dateOnly=s=>(s||'').slice(0,10),won=n=>Number(n||0).toLocaleString('ko-KR')+'원';function key(d){return[d.origin||'',d.destination||'',dateOnly(d.departure_at),dateOnly(d.return_at),d.airline||'',d.flight_number||''].join('|')}function grow(d){return serpMap.get(key(d))||null}function gurl(d){const g=grow(d);return g&&g.ok&&g.google_flights_url?g.google_flights_url:''}function freeGoogleUrl(d){const o=d.origin||'GMP',dest=d.destination||'CJU',dep=dateOnly(d.departure_at),ret=dateOnly(d.return_at);const q=`왕복 항공편 ${o} 출발 ${dest} 도착 ${dep} 출발 ${ret} 귀국`;return `https://www.google.com/travel/flights?hl=ko&curr=KRW&q=${encodeURIComponent(q)}`}function trust(d){const g=grow(d);let s=30;if(g?.ok)s+=25;if(g?.exact_flight_match)s+=20;if(g?.price_match_level==='close')s+=15;return Math.min(100,s)}function setFilter(v,b){active=v;document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('on'));b.classList.add('on');q.value='';render()}function source(){if(active==='JEJU')return [...jeju];let x=[...international];if(REG[active])x=x.filter(d=>REG[active].includes(d.destination));if(active==='google')x=x.filter(d=>gurl(d));return x}function render(){let x=source();const s=(q.value||'').toLowerCase();if(s)x=x.filter(d=>`${d.destination_name} ${d.destination} ${d.origin} ${d.airline||''}`.toLowerCase().includes(s));if(active==='JEJU')x.sort((a,b)=>a.price_krw-b.price_krw).slice(0,10);else if(sort.value==='trust')x.sort((a,b)=>trust(b)-trust(a)||a.price_krw-b.price_krw);else if(sort.value==='date')x.sort((a,b)=>(a.departure_at||'').localeCompare(b.departure_at||''));else x.sort((a,b)=>a.price_krw-b.price_krw);sectionTitle.textContent=active==='JEJU'?'🇰🇷 제주 왕복 TOP 10':'국제선 TOP 100';status.textContent=x.length+'개 표시';list.innerHTML=x.length?x.map((d,i)=>{const dom=active==='JEJU',gu=dom?freeGoogleUrl(d):gurl(d),home=OFFICIAL[String(d.airline||'').toUpperCase()]||'';return `<details class="deal"><summary><div class="row"><div class="rank">${i+1}</div><div><div class="title">${d.destination_name} <span style="font-size:10px;color:#888">${d.origin}→${d.destination}</span></div><div class="sub">${dateOnly(d.departure_at)} → ${dateOnly(d.return_at)} · ${d.airline||'-'} ${d.flight_number||''}</div><div class="price">${won(d.price_krw)} <small>${dom?'제주 국내선 최저가 순':'국제선 참고가'}</small></div><div class="chips">${dom?'<span class="chip green">SerpApi 0회</span><span class="chip blue">Google 바로 확인</span>':(gu?'<span class="chip blue">Google 검증</span>':'<span class="chip amber">Google 검증 대기</span>')}</div></div></div></summary><div class="body"><div class="grid"><div><small>구간</small><b>${d.origin} → ${d.destination}</b></div><div><small>출국</small><b>${dateOnly(d.departure_at)}</b></div><div><small>귀국</small><b>${dateOnly(d.return_at)}</b></div></div><div class="actions">${gu?`<a class="main" target="_blank" rel="noopener" href="${gu}">${dom?'Google에서 가격 확인':'Google Flights 비교'}</a>`:'<span class="disabled">Google 검증 대기</span>'}${home?`<a class="official" target="_blank" rel="noopener" href="${home}">항공사 홈페이지</a>`:'<span class="disabled">공식 링크 확인 중</span>'}</div><div class="note">${dom?`제주는 SerpApi 토큰을 사용하지 않습니다. ${d.origin}→CJU, ${dateOnly(d.departure_at)}~${dateOnly(d.return_at)} 조건으로 Google Flights를 직접 엽니다.`:'국제선만 SerpApi Google Flights 교차검증을 사용합니다.'}</div></div></details>`}).join(''):'<div class="empty">조건에 맞는 항공권이 없습니다.</div>'}async function init(){const f=await fetch('../data/travelpayouts_fares.json?ts='+Date.now()).then(r=>r.json());international=(f.top100||[]).filter(d=>d.destination!=='CJU');jeju=(f.jeju_top10||[]).filter(d=>d.destination==='CJU'&&(d.origin==='ICN'||d.origin==='GMP')).sort((a,b)=>a.price_krw-b.price_krw).slice(0,10);try{const s=await fetch('../data/serpapi_google_flights.json?ts='+Date.now()).then(r=>r.json());serpMap=new Map((s.results||[]).map(x=>[x.candidate_key,x]));googleCount.textContent=(s.results||[]).filter(x=>x.ok&&x.google_flights_url&&x.destination!=='CJU').length}catch(e){googleCount.textContent='0'}intCount.textContent=international.length;jejuCount.textContent=jeju.length;updatedAt.textContent=f.generated_at_utc?new Date(f.generated_at_utc).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'-';render()}init();</script><script src="./google-tfs.js?v=2"></script></body></html>
