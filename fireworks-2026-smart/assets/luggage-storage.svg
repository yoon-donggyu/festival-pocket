<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860"><rect width="1200" height="860" fill="#f4f8fb"/><text x="600" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="800" fill="#15213b">여의도 짐 보관은 여기서!</text><text x="600" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#4b5870">캐리어는 맡기고, 가볍게 불꽃축제 즐기기</text><g font-family="Arial, sans-serif"><rect x="48" y="154" width="528" height="620" rx="30" fill="#fff" stroke="#dce6f0" stroke-width="2"/><rect x="48" y="154" width="528" height="98" rx="30" fill="#122447"/><text x="86" y="216" font-size="46" font-weight="800" fill="#fff">IFC MALL</text><text x="82" y="306" font-size="27" font-weight="700" fill="#e03b78">📍 물품보관함</text><text x="82" y="352" font-size="25" font-weight="700" fill="#17202a">L1층 에스컬레이터 바로 근처</text><text x="82" y="396" font-size="21" fill="#52606d">애플스토어를 찾은 뒤, 바로 옆 통로로 들어가면 쉬움</text><rect x="82" y="442" width="210" height="106" rx="22" fill="#fff0f4"/><text x="104" y="480" font-size="18" fill="#8e2d50">이용 요금</text><text x="104" y="522" font-size="31" font-weight="800" fill="#c92d63">무료</text><rect x="316" y="442" width="210" height="106" rx="22" fill="#eef8ee"/><text x="338" y="480" font-size="18" fill="#2e6845">이용 시간</text><text x="338" y="522" font-size="27" font-weight="800" fill="#23623c">시간 제한 없음</text><rect x="82" y="582" width="444" height="146" rx="22" fill="#f7f8fa"/><text x="106" y="620" font-size="21" font-weight="700" fill="#17202a">찾는 순서</text><text x="106" y="660" font-size="20" fill="#344054">① L1층 이동 → ② 애플스토어 찾기</text><text x="106" y="698" font-size="20" fill="#344054">③ 옆 통로 → 에스컬레이터 근처 보관함</text><rect x="624" y="154" width="528" height="620" rx="30" fill="#fff" stroke="#dce6f0" stroke-width="2"/><rect x="624" y="154" width="528" height="98" rx="30" fill="#164738"/><text x="664" y="216" font-size="42" font-weight="800" fill="#fff">THE HYUNDAI SEOUL</text><text x="658" y="306" font-size="27" font-weight="700" fill="#2f6bb0">🧳 캐리어 보관 서비스</text><text x="658" y="352" font-size="26" font-weight="800" fill="#17202a">1F TOURIST DESK</text><text x="658" y="392" font-size="20" fill="#52606d">여행객의 편한 쇼핑을 위한 캐리어 보관 서비스</text><rect x="658" y="438" width="458" height="120" rx="22" fill="#eef7ff"/><text x="684" y="479" font-size="22" font-weight="700" fill="#245d9b">🗄 일반 물품보관함</text><text x="684" y="524" font-size="30" font-weight="800" fill="#17202a">B1 · B3 · B4</text><rect x="658" y="586" width="458" height="142" rx="22" fill="#f7f8fa"/><text x="684" y="625" font-size="21" font-weight="700" fill="#17202a">추천 사용법</text><text x="684" y="665" font-size="20" fill="#344054">기내용 캐리어 → 1F TOURIST DESK 우선</text><text x="684" y="702" font-size="20" fill="#344054">소형 짐 → B1/B3/B4 물품보관함 확인</text><rect x="48" y="798" width="1104" height="42" rx="18" fill="#fff3e6"/><text x="600" y="826" text-anchor="middle" font-size="19" font-weight="700" fill="#9a4a11">TIP · 불꽃축제 당일은 혼잡할 수 있으니 오전에 맡기고, 자리 이동 전 보관 위치를 사진으로 저장</text></g></svg>