<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Festival Pocket · 3D 장소 보기</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js"></script>
<style>
:root{color-scheme:dark;--bg:#0b0d12;--panel:rgba(16,19,26,.92);--line:rgba(255,255,255,.12);--text:#fff;--muted:#aab1bc;--accent:#8ab4ff}*{box-sizing:border-box}html,body,#map{width:100%;height:100%;margin:0}body{overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;color:var(--text)}#map{position:fixed;inset:0}.top{position:fixed;z-index:5;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:8px;align-items:center;padding:8px;background:rgba(12,14,20,.86);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(12px)}button,a{font:inherit}.icon,.chip,.share{border:1px solid var(--line);background:rgba(255,255,255,.07);color:#fff;cursor:pointer}.icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;text-decoration:none}.title{min-width:0;flex:1}.title b,.title span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.title b{font-size:14px}.title span{font-size:11px;color:var(--muted);margin-top:2px}.panel{position:fixed;z-index:5;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));max-height:48vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:8px 12px 12px;backdrop-filter:blur(14px);box-shadow:0 18px 50px rgba(0,0,0,.3);transition:max-height .2s ease,padding .2s ease}.panel-toggle{width:100%;height:36px;border:0;background:transparent;color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}.panel.collapsed{max-height:52px;overflow:hidden;padding:7px 12px}.panel.collapsed .panel-body{display:none}.panel-body{padding-top:4px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.metric{padding:10px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.045)}.metric small{display:block;color:var(--muted);font-size:11px}.metric b{display:block;margin-top:4px;font-size:15px}.tools{display:flex;gap:7px;overflow-x:auto;margin-top:10px;scrollbar-width:none}.tools::-webkit-scrollbar{display:none}.chip{min-height:38px;padding:8px 11px;border-radius:12px;white-space:nowrap}.chip.on{background:rgba(138,180,255,.2);border-color:rgba(138,180,255,.55)}.reason{margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.04);font-size:12px;line-height:1.55;color:#e7e9ed}.note{margin-top:8px;color:var(--muted);font-size:10px;line-height:1.45}.pin{width:20px;height:20px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#111;border:3px solid white;box-shadow:0 5px 18px rgba(0,0,0,.35)}.pin:after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:white;left:4px;top:4px}.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{display:none}@media(min-width:850px){.top{left:16px;right:auto;width:560px}.panel{left:auto;right:16px;bottom:16px;width:390px;max-height:620px}.panel.collapsed{max-height:52px}}
</style>
</head>
<body>
<div id="map"></div>
<header class="top"><a class="icon" href="./" aria-label="뒤로">←</a><div class="title"><b id="name">축제 3D 장소 보기</b><span id="place">장소 정보</span></div><button class="icon" id="share">↗</button></header>
<section class="panel collapsed" id="infoPanel"><button class="panel-toggle" id="panelToggle" type="button" aria-expanded="false">▲ 정보 열기</button><div class="panel-body"><div class="grid"><div class="metric"><small>Festival Pocket 추천도</small><b id="score">-</b></div><div class="metric"><small>앱 평점</small><b id="rating">-</b></div><div class="metric"><small>혼잡도</small><b id="crowd">-</b></div><div class="metric"><small>요금</small><b id="fee">-</b></div></div><div class="tools"><button class="chip" data-view="near">지상 근접뷰</button><button class="chip on" data-view="three">3D뷰</button><button class="chip" data-view="air">상공뷰</button><button class="chip on" id="ring500">500m</button><button class="chip" id="ring1000">1km</button></div><div class="reason" id="reason"></div><div class="note">※ 건물 높이는 OpenStreetMap 기반 데이터에 따라 일부 누락·오차가 있을 수 있습니다. 지상 근접뷰는 실제 스트리트뷰가 아니라 3D 지도 카메라를 낮춘 시점입니다.</div></div></section>
<script>
(()=>{
'use strict';
const q=new URLSearchParams(location.search),num=k=>Number(q.get(k));
const lat=num('lat'),lng=num('lng'),name=q.get('name')||'축제',place=q.get('place')||'',type=q.get('type')||'',rating=num('rating'),crowd=q.get('crowd')||'정보 없음',fee=q.get('fee')||'정보 없음',tags=(q.get('tags')||'').split(',').filter(Boolean);
if(!Number.isFinite(lat)||!Number.isFinite(lng)){alert('축제 좌표가 없습니다.');location.href='./';return;}
const crowdPoint={'여유':10,'보통':9,'혼잡':7,'매우 혼잡':4,'극심':1}[crowd]??6;
const feePoint=/무료/.test(fee)?10:/혼합|상이/.test(fee)?7:5;
const score=Math.max(0,Math.min(100,Math.round((Number.isFinite(rating)?rating:4)*16+crowdPoint+feePoint)));
document.title=name+' · 3D';document.getElementById('name').textContent=name;document.getElementById('place').textContent=place||`${lat.toFixed(4)}, ${lng.toFixed(4)}`;document.getElementById('score').textContent=score+'점';document.getElementById('rating').textContent=Number.isFinite(rating)?rating.toFixed(1)+'/5':'-';document.getElementById('crowd').textContent=crowd;document.getElementById('fee').textContent=fee.length>14?fee.slice(0,14)+'…':fee;
const reasons=[];if(rating>=4.7)reasons.push('앱 평점이 매우 높은 축제입니다.');else if(rating>=4.3)reasons.push('앱 평점이 높은 편입니다.');if(/극심|매우 혼잡/.test(crowd))reasons.push('혼잡도가 높아 이동·귀가 계획을 미리 잡는 편이 좋습니다.');else if(crowd==='보통')reasons.push('현재 등록 정보 기준 혼잡도는 보통입니다.');if(/무료/.test(fee))reasons.push('무료 관람 또는 무료 입장 요소가 있습니다.');if(tags.length)reasons.push('주요 키워드: '+tags.slice(0,4).join(' · '));if(/불꽃|빛|자연|야간/.test(type+' '+tags.join(' ')))reasons.push('관람 방향과 주변 건물 높이를 3D로 미리 확인하기 좋은 유형입니다.');document.getElementById('reason').textContent=reasons.join(' ');
const panel=document.getElementById('infoPanel'),panelToggle=document.getElementById('panelToggle');panelToggle.onclick=()=>{const collapsed=panel.classList.toggle('collapsed');panelToggle.textContent=collapsed?'▲ 정보 열기':'▼ 정보 접기';panelToggle.setAttribute('aria-expanded',String(!collapsed));setTimeout(()=>map.resize(),220)};
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[lng,lat],zoom:16.2,pitch:62,bearing:28,antialias:true});map.addControl(new maplibregl.NavigationControl({showCompass:true}),'top-right');const el=document.createElement('div');el.className='pin';new maplibregl.Marker({element:el,anchor:'bottom'}).setLngLat([lng,lat]).addTo(map);
function circle(radius){const coords=[],R=6378137,d=radius/R,lat1=lat*Math.PI/180,lon1=lng*Math.PI/180;for(let i=0;i<=72;i++){const br=i/72*Math.PI*2,la=Math.asin(Math.sin(lat1)*Math.cos(d)+Math.cos(lat1)*Math.sin(d)*Math.cos(br)),lo=lon1+Math.atan2(Math.sin(br)*Math.sin(d)*Math.cos(lat1),Math.cos(d)-Math.sin(lat1)*Math.sin(la));coords.push([lo*180/Math.PI,la*180/Math.PI])}return{type:'Feature',geometry:{type:'Polygon',coordinates:[coords]}}}
map.on('load',()=>{try{if(map.getSource('openmaptiles')&&!map.getLayer('fp-3d-buildings'))map.addLayer({id:'fp-3d-buildings',source:'openmaptiles','source-layer':'building',type:'fill-extrusion',minzoom:14,paint:{'fill-extrusion-color':'#c8c9cc','fill-extrusion-height':['coalesce',['get','render_height'],['get','height'],8],'fill-extrusion-base':['coalesce',['get','render_min_height'],0],'fill-extrusion-opacity':.78}})}catch(e){console.warn(e)}[['r500',500],['r1000',1000]].forEach(([id,r])=>{map.addSource(id,{type:'geojson',data:circle(r)});map.addLayer({id:id+'f',type:'fill',source:id,paint:{'fill-color':r===500?'#8ab4ff':'#ffffff','fill-opacity':r===500?.08:.035}});map.addLayer({id:id+'l',type:'line',source:id,paint:{'line-color':r===500?'#8ab4ff':'#ffffff','line-opacity':.7,'line-width':1.3}});map.setLayoutProperty(id+'f','visibility',r===500?'visible':'none');map.setLayoutProperty(id+'l','visibility',r===500?'visible':'none')})});
function view(mode){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===mode));if(mode==='near')map.easeTo({center:[lng,lat],zoom:18.2,pitch:78,bearing:25,duration:700});if(mode==='three')map.easeTo({center:[lng,lat],zoom:16.2,pitch:62,bearing:28,duration:700});if(mode==='air')map.easeTo({center:[lng,lat],zoom:14.4,pitch:30,bearing:0,duration:700})}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));
function toggleRing(r){const on=document.getElementById('ring'+r).classList.toggle('on');['f','l'].forEach(s=>map.getLayer('r'+r+s)&&map.setLayoutProperty('r'+r+s,'visibility',on?'visible':'none'))}document.getElementById('ring500').onclick=()=>toggleRing(500);document.getElementById('ring1000').onclick=()=>toggleRing(1000);
document.getElementById('share').onclick=async()=>{const data={title:name,text:name+' 3D 장소 보기',url:location.href};try{if(navigator.share)await navigator.share(data);else{await navigator.clipboard.writeText(location.href);alert('링크를 복사했습니다.')}}catch{}};
})();
</script>
</body>
</html>
