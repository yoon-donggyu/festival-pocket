name: Install Jeju TFS link
on:
  push:
    paths:
      - 'travel-pocket/.install-jeju-tfs'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load local TFS encoder after page script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('travel-pocket/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./google-tfs.js?v=2"></script>'
          if tag not in s:
              s=s.replace('</body></html>', tag+'</body></html>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add travel-pocket/index.html
          git diff --cached --quiet || git commit -m 'Use local tfs links for Jeju Google Flights'
          git push
