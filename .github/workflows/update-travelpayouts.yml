name: Update Travelpayouts fares

on:
  workflow_dispatch:
  schedule:
    # 17:00 KST = 08:00 UTC
    - cron: '0 8 * * *'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect Travelpayouts fares
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: python scripts/collect_travelpayouts.py

      - name: Commit updated fare data
        run: |
          git config user.name "travel-pocket-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/travelpayouts_fares.json data/travelpayouts_raw_summary.json
          if git diff --cached --quiet; then
            echo "No fare data changes"
            exit 0
          fi
          git commit -m "Update Travelpayouts fares"
          git push
