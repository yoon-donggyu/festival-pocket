name: Update Travel Pocket travel data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_travelpayouts.py'
      - 'scripts/collect_airport_schedules.py'
      - '.github/workflows/update-travelpayouts.yml'
  schedule:
    # Korea-focused refresh windows (GitHub cron uses UTC)
    # 01:30 KST: overnight airline/OTA inventory and fare changes
    - cron: '30 16 * * *'
    # 06:30 KST: recheck after overnight batch processing has largely settled
    - cron: '30 21 * * *'
    # 12:30 KST: daytime fare/package changes and newly released promotions
    - cron: '30 3 * * *'
    # 18:30 KST: evening travel-agency/package inventory and price refresh
    - cron: '30 9 * * *'

permissions:
  contents: write

concurrency:
  group: travel-pocket-data-refresh
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect Travelpayouts fares
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: python scripts/collect_travelpayouts.py

      - name: Probe Korean airport schedule APIs
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: python scripts/collect_airport_schedules.py

      - name: Commit updated travel data
        run: |
          git config user.name "travel-pocket-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/travelpayouts_fares.json data/travelpayouts_raw_summary.json data/airport_schedule_probe.json
          if git diff --cached --quiet; then
            echo "No travel data changes"
            exit 0
          fi
          git commit -m "Update Travel Pocket travel data"
          git pull --rebase origin main
          git push origin main
