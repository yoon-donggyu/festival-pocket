gress)dayProgress.style.width=(sd()===EVENT_DATE?Math.max(0,Math.min(100,(m-480)/(1300-480)*100)):0)+'%';if(typeof tick==='function')tick()}setTimeout(tick0800,50);setInterval(tick0800,30000);<\/script>`;html=html.replace('</body>',override+'</body>');document.open();document.write(html);document.close()}).catch(e=>{document.body.innerHTML='<div class="box"><b>페이지를 불러오지 못했습니다.</b><br><small>새로고침해주세요. '+e.message+'</small></div>'})</script></body></html>
