ttom-left,.maplibregl-ctrl-bottom-right{display:none}.toast{position:fixed;z-index:50;left:50%;bottom:145px;transform:translateX(-50%) translateY(15px);opacity:0;pointer-events:none;background:rgba(20,22,28,.94);border:1px solid rgba(255,255,255,.12);color:#fff;padding:9px 13px;border-radius:12px;font-size:11px;font-weight:750;transition:.2s;white-space:nowrap}.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}@media(min-width:800px){#map{inset:0}.top{right:auto;width:500px}.filters{right:auto;width:620px}.bottom-nav{left:50%;right:auto;width:520px;transform:translateX(-50%)}}

{id:11,name:'강동선사문화축제',dateText:'10.16 – 10.18 (예정)',region:'서울',district:'강동구',place:'서울 암사동 유적 일대',lat:37.5609,lng:127.1304,type:'역사·전통',rating:4.2,crowd:'혼잡',fee:'대부분 무료',tags:['선사시대','체험','가족','공연']},
{id:12,name:'제25회 서울억새축제',dateText:'10.17 – 10.23',region:'서울',district:'마포구',place:'월드컵공원 하늘공원',lat:37.5685,lng:126.8857,type:'자연·경관',rating:4.7,crowd:'매우 혼잡',fee:'무료',tags:['억새','노을','야경','데이트','사진']},
{id:13,name:'정동야행',dateText:'10.29 – 10.31',region:'서울',district:'중구',place:'정동·덕수궁 돌담길 일대',lat:37.5658,lng:126.9722,type:'빛·야간',rating:4.6,crowd:'혼잡',fee:'대부분 무료',tags:['야행','문화유산','산책','데이트']},
{id:14,name:'제21회 부산불꽃축제',dateText:'11.7(토)',region:'부산',district:'수영구',place:'광안리해수욕장·이기대·동백섬',lat:35.1532,lng:129.1187,type:'불꽃',rating:5.0,crowd:'극심',fee:'무료 관람 · 유료 지정석 별도',tags:['불꽃','광안대교','야경','1박추천']},
{id:15,name:'2026 서울윈터페스타',dateText:'12.4 – 2027.1.31',region:'서울',district:'도심',place:'광화문광장 외 6곳',lat:37.5724,lng:126.9769,type:'도심종합',rating:4.7,crowd:'매우 혼잡',fee:'행사별 상이',tags:['겨울','미디어아트','도심','야경']},
{id:16,name:'2026 서울라이트 광화문',dateText:'12.11 – 2027.1.3 · 17:30–22:00',region:'서울',district:'종로구',place:'광화문광장',lat:37.5728,lng:126.9775,type:'빛·야간',rating:4.7,crowd:'매우 혼잡',fee:'무료 관람 중심',tags:['미디어아트','빛','야경','데이트']},
{id:17,name:'2026 서울빛초롱축제',dateText:'12월 · 세부일정 미공개',region:'서울',district:'중구',place:'청계천 일대',lat:37.5690,lng:126.9785,type:'빛·야간',rating:4.6,crowd:'매우 혼잡',fee:'무료 관람 중심',tags:['빛','청계천','산책','사진']},
{id:18,name:'2026 광화문 마켓',dateText:'12월 · 세부일정 미공개',region:'서울',district:'종로구',place:'광화문광장',lat:37.5719,lng:126.9763,type:'크리스마스',rating:4.6,crowd:'매우 혼잡',fee:'무료 입장 · 구매 별도',tags:['크리스마스','마켓','먹거리','데이트']}
];
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[127.72,36.3],zoom:6.35,pitch:24,bearing:0,antialias:true});
map.addControl(new maplibregl.NavigationControl({showCompass:true}),'top-right');
let activeRegion='전체',popup=null,myMarker=null,savedLoc=null;
const markerRows=[];
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),1800)}
function genericUrl(f){if(f.id===14)return'busan-fireworks-3d-share.html';const p=new URLSearchParams({lat:f.lat,lng:f.lng,name:f.name,place:f.place,type:f.type,rating:f.rating,crowd:f.crowd,fee:f.fee,tags:f.tags.join(',')});return'festival-3d.html?'+p.toString()}
function distanceKm(a,b){const R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180,la1=a.lat*Math.PI/180,la2=b.lat*Math.PI/180;const h=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function openFestival(f){if(popup)popup.remove();let dist='';if(savedLoc){const d=distanceKm(savedLoc,{lat:f.lat,lng:f.lng});dist=`<div class="pop-dist">저장 위치에서 ${d<10?d.toFixed(1):Math.round(d)}km</div>`}const html=`<div class="pop-name">★ ${f.name}</div><div class="pop-meta">${f.dateText}<br>${f.region} ${f.district} · ${f.place}<br>평점 ${f.rating.toFixed(1)}/5 · ${f.crowd}</div>${dist}<div class="pop-actions"><button id="fly3d">이 지역 3D</button><a href="${genericUrl(f)}">상세 3D</a></div>`;popup=new maplibregl.Popup({offset:18,closeButton:true,maxWidth:'300px'}).setLngLat([f.lng,f.lat]).setHTML(html).addTo(map);setTimeout(()=>{const b=document.getElementById('fly3d');if(b)b.onclick=()=>map.flyTo({center:[f.lng,f.lat],zoom:15.7,pitch:62,bearing:28,duration:1200})},0)}
function nationwide(){if(popup){popup.remove();popup=null}map.flyTo({center:[127.72,36.3],zoom:6.35,pitch:24,bearing:0,duration:900})}
function updateMarkers(){let count=0;markerRows.forEach(row=>{const show=activeRegion==='전체'||row.f.region===activeRegion;row.el.style.display=show?'grid':'none';if(show)count++});document.getElementById('summary').textContent=`${activeRegion==='전체'?'전국':activeRegion} 축제 ${count}곳 · 별을 눌러 지역 3D 보기`}
function fitRegion(){const arr=festivals.filter(f=>activeRegion==='전체'||f.region===activeRegion);if(activeRegion==='전체'){nationwide();return}const bounds=new maplibregl.LngLatBounds();arr.forEach(f=>bounds.extend([f.lng,f.lat]));if(arr.length===1)map.flyTo({center:[arr[0].lng,arr[0].lat],zoom:10.5,pitch:35,duration:800});else map.fitBounds(bounds,{padding:80,maxZoom:11,duration:800})}
festivals.forEach(f=>{const el=document.createElement('div');el.className='star-marker'+(f.type==='불꽃'?' fire':'');el.textContent='★';el.title=f.name;el.setAttribute('aria-label',f.name);el.onclick=e=>{e.stopPropagation();openFestival(f)};const marker=new maplibregl.Marker({element:el,anchor:'center'}).setLngLat([f.lng,f.lat]).addTo(map);markerRows.push({f,el,marker})});
const regions=['전체',...new Set(festivals.map(f=>f.region))],filters=document.getElementById('filters');filters.innerHTML=regions.map(r=>`<button class="filter${r==='전체'?' on':''}" data-r="${r}">${r}</button>`).join('');filters.onclick=e=>{const b=e.target.closest('[data-r]');if(!b)return;activeRegion=b.dataset.r;filters.querySelectorAll('.filter').forEach(x=>x.classList.toggle('on',x===b));updateMarkers();fitRegion()};
document.getElementById('home').onclick=nationwide;
function placeSavedLocation(loc,fly=false){savedLoc=loc;if(myMarker)myMarker.remove();const el=document.createElement('div');el.className='my-marker';el.title='내 저장 위치';myMarker=new maplibregl.Marker({element:el,anchor:'center'}).setLngLat([loc.lng,loc.lat]).addTo(map);document.getElementById('goLoc').classList.add('saved');if(fly)map.flyTo({center:[loc.lng,loc.lat],zoom:13.5,pitch:45,bearing:0,duration:800})}
try{const raw=localStorage.getItem('festivalPocketSavedLocation');if(raw){const v=JSON.parse(raw);if(Number.isFinite(v.lat)&&Number.isFinite(v.lng))placeSavedLocation(v,false)}}catch(e){}
document.getElementById('saveLoc').onclick=()=>{if(!navigator.geolocation){toast('이 기기에서는 위치 기능을 사용할 수 없습니다');return}const btn=document.getElementById('saveLoc');btn.textContent='위치 확인 중…';navigator.geolocation.getCurrentPosition(pos=>{const loc={lat:pos.coords.latitude,lng:pos.coords.longitude,savedAt:Date.now()};try{localStorage.setItem('festivalPocketSavedLocation',JSON.stringify(loc))}catch(e){}placeSavedLocation(loc,true);btn.textContent='✓ 내 위치 저장됨';btn.classList.add('saved');toast('현재 위치를 이 기기에 저장했습니다')},err=>{btn.textContent='◎ 내 위치 저장';toast(err.code===1?'위치 권한을 허용해주세요':'현재 위치를 가져오지 못했습니다')},{enableHighAccuracy:true,timeout:10000,maximumAge:30000})};
document.getElementById('goLoc').onclick=()=>{if(savedLoc){placeSavedLocation(savedLoc,true);toast('저장 위치로 이동했습니다')}else document.getElementById('saveLoc').click()};
map.on('load',()=>{try{if(map.getSource('openmaptiles')&&!map.getLayer('fp-all-buildings'))map.addLayer({id:'fp-all-buildings',source:'openmaptiles','source-layer':'building',type:'fill-extrusion',minzoom:14,paint:{'fill-extrusion-color':'#c8c9cc','fill-extrusion-height':['coalesce',['get','render_height'],['get','height'],8],'fill-extrusion-base':['coalesce',['get','render_min_height'],0],'fill-extrusion-opacity':.76}})}catch(e){console.warn('3D buildings unavailable',e)}});
updateMarkers();
})();
